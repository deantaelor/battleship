<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Battleship</h1>
    <p class="subtitle">manual, advised, and autonomous fire control</p>
  </header>

  <main>
    <div class="top-bar">
      <button id="new-game" class="pill-btn">New Game</button>

      <div class="autonomy-tabs" role="tablist" aria-label="Autonomy level">
        <button class="pill-btn active" data-autonomy="manual" aria-pressed="true">Manual</button>
        <button class="pill-btn" data-autonomy="advised" aria-pressed="false">Advised</button>
        <button class="pill-btn" data-autonomy="autonomous" aria-pressed="false">Autonomous</button>
      </div>

      <div class="difficulty-wrap">
        <label for="difficulty-select">Enemy AI</label>
        <div class="select-wrap">
          <select id="difficulty-select">
            <option value="random">Random</option>
            <option value="hunt">Hunt & Target</option>
            <option value="probability">Probability Density</option>
          </select>
        </div>
      </div>
    </div>

    <div id="command-panel" class="command-panel">
      <label for="order-input">Order to gunner</label>
      <input id="order-input" type="text" placeholder="e.g. finish whatever we wounded" autocomplete="off">
      <button id="action-btn" class="pill-btn primary">Plan</button>
      <button id="approve-btn" class="pill-btn primary" style="display: none;">Fire as proposed</button>
      <button id="abort-btn" class="pill-btn" style="display: none;">Stand down</button>
      <div id="proposal" class="proposal"></div>
    </div>

    <div class="status" id="status">Click a cell on the enemy board to fire.</div>

    <div class="boards">
      <div class="board-wrap">
        <h2>Your Fleet</h2>
        <div id="player-board" class="board"></div>
      </div>
      <div class="board-wrap">
        <h2>Enemy Waters</h2>
        <div id="enemy-board" class="board"></div>
      </div>
    </div>

    <section class="logs">
      <h2>Ship’s Log</h2>
      <ul id="log-list"></ul>
    </section>
  </main>

  <div id="report" class="report-overlay" style="display: none;">
    <div class="report-card">
      <h2>After-action report</h2>
      <div id="report-body"></div>
      <button id="report-close" class="pill-btn primary">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
